# Static Gospel Chrome - wezterm
# place in ~/.config/wezterm/colors/, then: config.color_scheme = "Static Gospel Chrome"

[metadata]
name = "Static Gospel Chrome"
author = "Sam Lightbody"

[colors]
foreground = "#eef4ff"
background = "#06151c"
cursor_bg = "#37f499"
cursor_fg = "#06151c"
cursor_border = "#37f499"
selection_fg = "#d6deec"
selection_bg = "#12445a"
ansi = ["#1e2f36", "#ff3b30", "#37f499", "#f0ff3c", "#5a8cff", "#ff2a8a", "#00eaff", "#d6deec"]
brights = ["#6b7a8f", "#ff6a5c", "#69f8b3", "#f7ff8a", "#8aacff", "#ff6aaa", "#6af3ff", "#eef4ff"]
