# Static Gospel Void Lifted - k9s skin
# place in ~/.config/k9s/skins/static-gospel-void-lifted.yaml, then set in config.yaml:
#   k9s:
#     ui:
#       skin: static-gospel-void-lifted

k9s:
  body:
    fgColor: "#f5f5ff"
    bgColor: "#190a24"
    logoColor: "#04d1f9"
  prompt:
    fgColor: "#f5f5ff"
    bgColor: "#190a24"
    suggestColor: "#e87500"
  info:
    fgColor: "#04d1f9"
    sectionColor: "#f5f5ff"
  dialog:
    fgColor: "#f5f5ff"
    bgColor: "#190a24"
    buttonFgColor: "#190a24"
    buttonBgColor: "#04d1f9"
    buttonFocusFgColor: "#190a24"
    buttonFocusBgColor: "#37f499"
    labelFgColor: "#ffce54"
    fieldFgColor: "#f5f5ff"
  frame:
    border:
      fgColor: "#333048"
      focusColor: "#fa4fbc"
    menu:
      fgColor: "#f5f5ff"
      keyColor: "#e87500"
      numKeyColor: "#e87500"
    crumbs:
      fgColor: "#190a24"
      bgColor: "#6e7487"
      activeColor: "#04d1f9"
    status:
      newColor: "#04d1f9"
      modifyColor: "#9d6bff"
      addColor: "#37f499"
      errorColor: "#ff3860"
      highlightColor: "#ffce54"
      killColor: "#e87500"
      completedColor: "#6e7487"
    title:
      fgColor: "#f5f5ff"
      bgColor: "#190a24"
      highlightColor: "#ffce54"
      counterColor: "#e87500"
      filterColor: "#04d1f9"
  views:
    charts:
      bgColor: "#190a24"
      defaultDialColors:
        - "#04d1f9"
        - "#ff3860"
      defaultChartColors:
        - "#04d1f9"
        - "#ff3860"
    table:
      fgColor: "#f5f5ff"
      bgColor: "#190a24"
      cursorFgColor: "#f5f5ff"
      cursorBgColor: "#4c3f58"
      header:
        fgColor: "#f5f5ff"
        bgColor: "#190a24"
        sorterColor: "#37f499"
    xray:
      fgColor: "#f5f5ff"
      bgColor: "#190a24"
      cursorColor: "#4c3f58"
      graphicColor: "#04d1f9"
    yaml:
      keyColor: "#9d6bff"
      colonColor: "#8992a8"
      valueColor: "#f5f5ff"
    logs:
      fgColor: "#f5f5ff"
      bgColor: "#190a24"
      indicator:
        fgColor: "#04d1f9"
        bgColor: "#190a24"
