# Static Gospel Abyssal - k9s skin
# place in ~/.config/k9s/skins/static-gospel-abyssal.yaml, then set in config.yaml:
#   k9s:
#     ui:
#       skin: static-gospel-abyssal

k9s:
  body:
    fgColor: "#f5f5ff"
    bgColor: "#0a1020"
    logoColor: "#04d1f9"
  prompt:
    fgColor: "#f5f5ff"
    bgColor: "#0a1020"
    suggestColor: "#ff8506"
  info:
    fgColor: "#04d1f9"
    sectionColor: "#f5f5ff"
  dialog:
    fgColor: "#f5f5ff"
    bgColor: "#0a1020"
    buttonFgColor: "#0a1020"
    buttonBgColor: "#04d1f9"
    buttonFocusFgColor: "#0a1020"
    buttonFocusBgColor: "#37f499"
    labelFgColor: "#ffce54"
    fieldFgColor: "#f5f5ff"
  frame:
    border:
      fgColor: "#222a3a"
      focusColor: "#fa4fbc"
    menu:
      fgColor: "#f5f5ff"
      keyColor: "#ff8506"
      numKeyColor: "#ff8506"
    crumbs:
      fgColor: "#0a1020"
      bgColor: "#6e7487"
      activeColor: "#04d1f9"
    status:
      newColor: "#04d1f9"
      modifyColor: "#9d6bff"
      addColor: "#37f499"
      errorColor: "#ff3860"
      highlightColor: "#ffce54"
      killColor: "#ff8506"
      completedColor: "#6e7487"
    title:
      fgColor: "#f5f5ff"
      bgColor: "#0a1020"
      highlightColor: "#ffce54"
      counterColor: "#ff8506"
      filterColor: "#04d1f9"
  views:
    charts:
      bgColor: "#0a1020"
      defaultDialColors:
        - "#04d1f9"
        - "#ff3860"
      defaultChartColors:
        - "#04d1f9"
        - "#ff3860"
    table:
      fgColor: "#f5f5ff"
      bgColor: "#0a1020"
      cursorFgColor: "#f5f5ff"
      cursorBgColor: "#3d4558"
      header:
        fgColor: "#f5f5ff"
        bgColor: "#0a1020"
        sorterColor: "#37f499"
    xray:
      fgColor: "#f5f5ff"
      bgColor: "#0a1020"
      cursorColor: "#3d4558"
      graphicColor: "#04d1f9"
    yaml:
      keyColor: "#9d6bff"
      colonColor: "#97a0b6"
      valueColor: "#f5f5ff"
    logs:
      fgColor: "#f5f5ff"
      bgColor: "#0a1020"
      indicator:
        fgColor: "#04d1f9"
        bgColor: "#0a1020"
