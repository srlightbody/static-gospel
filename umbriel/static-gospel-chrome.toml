# Static Gospel Chrome - umbriel
# add to [include] files in config.toml, after your shared config:  "~/.config/umbriel/static-gospel-chrome.toml"

[colors]
background = "#06151cff"
backdrop = "#06151cff"
text_primary = "#eef4ffff"
text_muted = "#6b7a8fff"
accent_primary = "#00eaffff"
accent_secondary = "#f0ff3cff"
error = "#ff3b30ff"
warning = "#f0ff3cff"
insert_hint = "#00eaff80"
shadow = "#050b0d7f"

[colors.border]
focused = "#00eaffff"
unfocused = "#324750ff"
outer = "#050b0dff"

[colors.overview]
background_tint = "#050b0d30"
badge = "#00eaffff"
workspace_background = "#050b0d44"

[colors.tab_bar]
background = "#0b1f28ff"
text = "#6b7a8fff"
active = "#00eaffff"
active_text = "#06151cff"
active_unfocused = "#132e3aff"
active_unfocused_text = "#eef4ffff"
urgent = "#ff3b30ff"
urgent_text = "#06151cff"
