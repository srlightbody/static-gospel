# Static Gospel Chrome - umbriel
# add to [include] files in config.toml, after your shared config:  "~/.config/umbriel/static-gospel-chrome.toml"

[colors]
background = "#0a0e15ff"
backdrop = "#0a0e15ff"
text_primary = "#eef4ffff"
text_muted = "#6b7a8fff"
accent_primary = "#00eaffff"
accent_secondary = "#f0ff3cff"
error = "#ff3b30ff"
warning = "#f0ff3cff"
insert_hint = "#00eaff80"
shadow = "#05080d7f"

[colors.border]
focused = "#00eaffff"
unfocused = "#323d50ff"
outer = "#05080dff"

[colors.overview]
background_tint = "#05080d30"
badge = "#00eaffff"
workspace_background = "#05080d44"

[colors.tab_bar]
background = "#0f1520ff"
text = "#6b7a8fff"
active = "#00eaffff"
active_text = "#0a0e15ff"
active_unfocused = "#18212fff"
active_unfocused_text = "#eef4ffff"
urgent = "#ff3b30ff"
urgent_text = "#0a0e15ff"
