# Static Gospel — single source of truth for all app themes.
# Edit here, then run `python build/build.py` to regenerate every app file.
# Accents are shared across variants unless a variant overrides keys in its own
# [variants.<name>.accents] / [variants.<name>.bright] tables.

# order controls emission order in palette.lua
order = ["void", "void-lifted", "chrome"]

[accents]
# steel neutrals: recooled off rose pine's warm violet-gray so they read as
# cold machine over the void black-violet, not cozy.
ash       = "#6e7487"
shroud    = "#8992a8"
text      = "#f5f5ff"

# static gospel: a cthulhu cult running on futuristic tech,
# the neon is the delivery, the horror is the payload. Full-chroma field- punch
# comes from hue contrast on the void ramp, not from saturating a muted field.
# rift = violet ritual (keywords), siren = magenta wound (functions), verdigris
# = toxic-teal wrongness (types/props/members), witchfire = forbidden gold
# (strings/numbers/constants), ichor = wound-red (errors), ember = signal
# orange (parameters/directives/attributes/links, the synthwave partner to the
# violet). aether stays an electric-cyan signal, a step hotter than the field;
# blight/cursor keep the green- the one thing genuinely alive.
ichor      = "#ff3860"
witchfire  = "#ffce54"
siren      = "#fa4fbc"
rift       = "#9d6bff"
aether     = "#04d1f9"
verdigris  = "#00c28f"
ember      = "#e87500"
blight     = "#37f499"
cursor     = "#37f499"

# bright ANSI (8..15); 8 = ash, 15 = text, plus normal-7 white.
# brights ride a step up from the field accents; green/cyan stay the glow family.
# ANSI pairs: 4/12 = rift/blue (violet), 5/13 = siren/magenta (pink). ember and
# verdigris have no ANSI slot; nvim accents and ANSI are allowed to diverge.
[bright]
white7  = "#dbdcf2"
red     = "#ff5c78"
green   = "#69f8b3"
yellow  = "#ffe08a"
blue    = "#b892ff"
magenta = "#ff86d4"
cyan    = "#66e4fd"

# delta diff backgrounds are computed per variant in build.py: ichor/blight
# blended onto that variant's base at 25% (line) and 40% (emph).

[variants.void]
suffix       = ""
comment      = ["void: near-black violet (default) — night city, the drowned lit up"]
base         = "#130420"
surface      = "#17112b"
overlay      = "#241a38"
_nc          = "#0a0214"
hl_low       = "#21202e"
hl_med       = "#403d52"
hl_high      = "#524f67"
inactive_tab = "#1f1d2e"
border       = "#26233a"
selection    = "#4b3f58"

[variants."void-lifted"]
suffix       = "Void Lifted"
comment      = [
  "void-lifted: void's violet adapted to a basic laptop LCD, with raised mid-tones",
  "and wider steps. The floor rises only halfway so the base stays deep while the",
  "surface and overlay remain distinct on a lower-contrast panel.",
]
base         = "#190a24"
surface      = "#261d38"
overlay      = "#382e4e"
_nc          = "#12071c"
hl_low       = "#2b2a38"
hl_med       = "#464358"
hl_high      = "#58556e"
inactive_tab = "#211f30"
border       = "#333048"
selection    = "#4c3f58"

[variants.chrome]
suffix       = "Chrome"
comment      = [
  "chrome: the cult's neon with the cult taken out. Cold blue-black instead of",
  "violet, acid yellow strings, hot pink functions, electric blue keywords; violet",
  "survives only on types. ANSI hue slots match void so terminal apps still read.",
]
base         = "#0a0e15"
surface      = "#0f1520"
overlay      = "#18212f"
_nc          = "#05080d"
hl_low       = "#1a2130"
hl_med       = "#323d50"
hl_high      = "#455265"
inactive_tab = "#121925"
border       = "#1e2836"
selection    = "#173a4a"

[variants.chrome.accents]
ash       = "#6b7a8f"
shroud    = "#8b9bb2"
text      = "#eef4ff"
ichor     = "#ff3b30"
witchfire = "#f0ff3c"
siren     = "#ff2a8a"
rift      = "#5a8cff"
aether    = "#00eaff"
verdigris = "#a37cff"
ember     = "#ff8a1f"

[variants.chrome.bright]
white7  = "#d6deec"
red     = "#ff6a5c"
yellow  = "#f7ff8a"
blue    = "#8aacff"
magenta = "#ff6aaa"
cyan    = "#6af3ff"
