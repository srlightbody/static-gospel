# Static Gospel — single source of truth for all app themes.
# Edit here, then run `python build/build.py` to regenerate every app file.
# Shared colors are identical across variants; only [variants.*] ramps change.

# order controls emission order in palette.lua
order = ["void", "drowned", "abyssal", "lifted", "void-lifted"]

[accents]
# steel neutrals: recooled off rose pine's warm violet-gray so they read as
# cold machine over the void black-violet, not cozy.
ash       = "#6e7487"
shroud    = "#97a0b6"
text      = "#ebfafa"

# static gospel: a cthulhu cult running on futuristic tech,
# the neon is the delivery, the horror is the payload. Full-chroma field- punch
# comes from hue contrast on the void ramp, not from saturating a muted field.
# rift = violet ritual (keywords), siren = magenta wound (functions), verdigris
# = toxic-teal wrongness (types/props/members), witchfire = forbidden gold
# (strings/numbers/constants), ichor = wound-red (errors). aether stays an
# electric-cyan signal, a step hotter than the field; blight/cursor keep the
# green- the one thing genuinely alive.
ichor      = "#ff3860"
witchfire  = "#ffce54"
siren      = "#fa4fbc"
rift       = "#9d6bff"
aether     = "#04d1f9"
verdigris = "#22e0c0"
umbra      = "#b48eff"
blight     = "#37f499"
cursor     = "#37f499"

# bright ANSI (8..15); 8 = ash, 15 = text, plus normal-7 white.
# brights ride a step up from the field accents; green/cyan stay the glow family.
# NOTE: color4 (blue) = rift is now violet and color5 (magenta) = umbra is a
# near violet, so the terminal blue/magenta slots sit close- known tradeoff of
# the pivot (nvim/ANSI are allowed to diverge; decouple if vibro-cult graduates).
[bright]
white7  = "#e0def4"
red     = "#ff5c78"
green   = "#69f8b3"
yellow  = "#ffe08a"
blue    = "#b892ff"
magenta = "#ff86d4"
cyan    = "#66e4fd"

# delta diff backgrounds — fixed across variants
[delta]
minus      = "#3a1f2a"
minus_emph = "#5a2535"
plus       = "#16302a"
plus_emph  = "#1d4a3e"

