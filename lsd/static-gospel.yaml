# Static Gospel - lsd
# place at ~/.config/lsd/colors.yaml (lsd reads it directly), or point lsd at it.

user: "#ffce54"
group: "#6e7487"
permission:
  read: "#00c28f"
  write: "#ffce54"
  exec: "#ff3860"
  exec-sticky: "#e87500"
  no-access: "#6e7487"
  octal: "#04d1f9"
  acl: "#04d1f9"
  context: "#e87500"
date:
  hour-old: "#04d1f9"
  day-old: "#04d1f9"
  older: "#6e7487"
size:
  none: "#6e7487"
  small: "#00c28f"
  medium: "#ffce54"
  large: "#ff3860"
inode:
  valid: "#e87500"
  invalid: "#6e7487"
links:
  valid: "#e87500"
  invalid: "#6e7487"
tree-edge: "#26233a"
git-status:
  default: "#f5f5ff"
  unmodified: "#6e7487"
  ignored: "#6e7487"
  new-in-index: "#37f499"
  new-in-workdir: "#37f499"
  typechange: "#ffce54"
  deleted: "#ff3860"
  modified: "#ffce54"
  renamed: "#04d1f9"
  conflicted: "#ff3860"
