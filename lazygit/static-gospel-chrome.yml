# Static Gospel Chrome - lazygit
# Keep this as a standalone file and layer it over your config via LG_CONFIG_FILE:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/static-gospel-chrome.yml"
# (rightmost wins) so theme updates never touch your personal config.

gui:
  theme:
    activeBorderColor:
      - "#00eaff"
      - bold
    inactiveBorderColor:
      - "#6b7a8f"
    searchingActiveBorderColor:
      - "#f5e94a"
      - bold
    optionsTextColor:
      - "#5a8cff"
    selectedLineBgColor:
      - "#1e2836"
    cherryPickedCommitFgColor:
      - "#00eaff"
    cherryPickedCommitBgColor:
      - "#323d50"
    markedBaseCommitFgColor:
      - "#f5e94a"
    markedBaseCommitBgColor:
      - "#323d50"
    unstagedChangesColor:
      - "#ff3b30"
    defaultFgColor:
      - "#eef4ff"
  authorColors:
    "*": "#ff8a1f"
