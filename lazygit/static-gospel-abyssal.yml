# Static Gospel Abyssal - lazygit
# Keep this as a standalone file and layer it over your config via LG_CONFIG_FILE:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/static-gospel-abyssal.yml"
# (rightmost wins) so theme updates never touch your personal config.

gui:
  theme:
    activeBorderColor:
      - "#04d1f9"
      - bold
    inactiveBorderColor:
      - "#6e7487"
    searchingActiveBorderColor:
      - "#ffce54"
      - bold
    optionsTextColor:
      - "#9d6bff"
    selectedLineBgColor:
      - "#222a3a"
    cherryPickedCommitFgColor:
      - "#04d1f9"
    cherryPickedCommitBgColor:
      - "#3a4358"
    markedBaseCommitFgColor:
      - "#ffce54"
    markedBaseCommitBgColor:
      - "#3a4358"
    unstagedChangesColor:
      - "#ff3860"
    defaultFgColor:
      - "#ebfafa"
  authorColors:
    "*": "#b48eff"
