# Static Gospel - lazygit
# Keep this as a standalone file and layer it over your config via LG_CONFIG_FILE:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/static-gospel.yml"
# (rightmost wins) so theme updates never touch your personal config.

gui:
  theme:
    activeBorderColor:
      - "#04d1f9"
      - bold
    inactiveBorderColor:
      - "#6e7487"
    searchingActiveBorderColor:
      - "#ffce54"
      - bold
    optionsTextColor:
      - "#9d6bff"
    selectedLineBgColor:
      - "#26233a"
    cherryPickedCommitFgColor:
      - "#04d1f9"
    cherryPickedCommitBgColor:
      - "#403d52"
    markedBaseCommitFgColor:
      - "#ffce54"
    markedBaseCommitBgColor:
      - "#403d52"
    unstagedChangesColor:
      - "#ff3860"
    defaultFgColor:
      - "#f5f5ff"
  authorColors:
    "*": "#e87500"
